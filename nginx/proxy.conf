# nginx front end: public API, generated files and the validator's probe endpoint.
# Mounted as /etc/nginx/conf.d/default.conf (http context).

limit_req_zone  $binary_remote_addr zone=api_rl:10m   rate=10r/s;
limit_req_zone  $binary_remote_addr zone=files_rl:10m rate=5r/s;
limit_req_zone  $binary_remote_addr zone=probe_rl:10m rate=20r/s;
limit_conn_zone $binary_remote_addr zone=conn_per_ip:10m;
limit_req_status  429;
limit_conn_status 429;

# short micro-cache in front of the list/stats endpoints: bursts of identical
# queries cost one upstream request per 5 s
proxy_cache_path /var/cache/nginx/api levels=1:2 keys_zone=api_cache:10m max_size=64m inactive=60s use_temp_path=off;

upstream pqa_api {
    server api:8000;
    keepalive 32;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    server_tokens off;
    client_max_body_size 1k;
    limit_conn conn_per_ip 30;

    gzip on;
    gzip_types application/json text/plain;
    gzip_min_length 1024;
    gzip_vary on;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;

    # ------------------------------------------------------------------------
    # Probe endpoint used by the validator (PROBE_HTTP_URL=http://<vps-ip>/probe,
    # PROBE_OWNED=true). Answered by nginx itself: no Python, a few hundred bytes.
    # It reports the address the request came from (= the proxy's exit IP), echoes
    # the per-request nonce and the proxy-identifying headers the proxy added.
    # Must be reached directly (not through a CDN) for exit-IP checks to be valid.
    # ------------------------------------------------------------------------
    location = /probe {
        limit_req zone=probe_rl burst=100 nodelay;
        if ($arg_n !~ "^[A-Za-z0-9]{0,64}$") {
            return 400;
        }
        access_log off;
        default_type text/plain;
        add_header Cache-Control "no-store, no-transform" always;
        return 200 "ip=$remote_addr\nn=$arg_n\nvia=$http_via\nxff=$http_x_forwarded_for\nfwd=$http_forwarded\n";
    }

    location = /nginx-health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # liveness / readiness (not cached, not rate limited: used by monitors)
    location ~ ^/(health|ready)$ {
        access_log off;
        proxy_pass http://pqa_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 10s;
    }

    # random proxy: never cached
    location = /api/v1/proxies/random {
        limit_req zone=api_rl burst=40 nodelay;
        proxy_pass http://pqa_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 15s;
    }

    location /api/ {
        limit_req zone=api_rl burst=40 nodelay;
        limit_except GET HEAD OPTIONS { deny all; }

        proxy_cache api_cache;
        proxy_cache_key "$request_method$request_uri";
        proxy_cache_valid 200 5s;
        proxy_cache_valid 404 2s;
        proxy_cache_lock on;
        proxy_cache_use_stale updating error timeout http_502 http_503;
        add_header X-Cache $upstream_cache_status always;

        proxy_pass http://pqa_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 15s;
    }

    location ~ ^/(docs|openapi\.json)$ {
        limit_req zone=api_rl burst=20 nodelay;
        proxy_pass http://pqa_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
    }

    # generated snapshot files (written atomically by the worker every 2 minutes)
    location /data/ {
        limit_req zone=files_rl burst=20 nodelay;
        alias /usr/share/nginx/data/;
        autoindex on;
        default_type text/plain;
        charset utf-8;
        add_header Cache-Control "public, max-age=60" always;
        add_header Access-Control-Allow-Origin "*" always;
        location ~ /\. { deny all; }   # never expose temp files
    }

    location = / {
        default_type application/json;
        return 200 '{"name":"proxy-quality-api","docs":"/docs","proxies":"/api/v1/proxies","random":"/api/v1/proxies/random","stats":"/api/v1/stats","files":"/data/"}\n';
    }

    location / {
        return 404;
    }
}
