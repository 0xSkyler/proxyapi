# Alembic CLI configuration (developers). Production uses `python -m proxy_quality migrate`,
# which configures the same script location programmatically. DATABASE_URL is read from the
# environment / .env by migrations/env.py.
[alembic]
script_location = src/proxy_quality/database/migrations
prepend_sys_path = src
version_path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
