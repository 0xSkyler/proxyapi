# Public proxy source configuration.
#
# ProxyScrape is the ONLY public source configured here. The worker fetches
# the v4 free list every 2 minutes and preserves the protocol included in each
# protocol://ip:port record before validation.
#
# Review the source provider's current terms before redistributing generated
# lists from your deployment.

defaults:
  timeout: 20
  max_bytes: 20000000
  concurrency: 1
  min_interval_seconds: 120
  user_agent: "proxy-quality-api/1.0 (+ProxyScrape refresh)"

sources:
  - name: proxyscrape_v4
    url: "https://api.proxyscrape.com/v4/free-proxy-list/get?request=display_proxies&proxy_format=protocolipport&format=text"
    protocol: auto
    format: text
    enabled: true
    priority: 1
    timeout: 20
    min_interval_seconds: 120
    homepage: "https://proxyscrape.com/free-proxy-list"
    license: "ProxyScrape public free proxy API; review current terms before redistribution"
    redistribution_verified: true
    notes: "Only public proxy source. Refreshed every 120 seconds."
