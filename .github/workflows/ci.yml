name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: pqa
          POSTGRES_PASSWORD: pqa
          POSTGRES_DB: pqa_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U pqa -d pqa_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql+asyncpg://pqa:pqa@localhost:5432/pqa_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check src tests
      - run: pytest -q

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: validate compose file
        run: POSTGRES_PASSWORD=ci docker compose config -q
      - name: build image
        run: docker build -t proxy-quality-api:ci .
      - name: nginx config test
        run: |
          docker run --rm --add-host api:127.0.0.1 \
            -v "$PWD/nginx/proxy.conf:/etc/nginx/conf.d/default.conf:ro" nginx:1.27-alpine nginx -t
